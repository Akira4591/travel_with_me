name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check active 2D product
        run: npm run check

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Test
        run: npm test

      - name: AI guide import evaluation
        run: npm run test:guide-import

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e
