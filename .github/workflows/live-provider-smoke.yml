name: live-provider-smoke

on:
  workflow_dispatch:
    inputs:
      provider:
        description: 'Provider smoke target'
        required: true
        default: 'all'
        type: choice
        options:
          - amap
          - elevation
          - all
      browser:
        description: 'Browser project'
        required: true
        default: 'chromium'
        type: choice
        options:
          - chromium

concurrency:
  group: live-provider-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    environment: live-provider
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:live-provider -- --project=${{ inputs.browser }}
        env:
          LIVE_PROVIDER: '1'
          AMAP_JS_KEY: ${{ secrets.AMAP_JS_KEY }}
          AMAP_JSCODE: ${{ secrets.AMAP_JSCODE }}
          AMAP_WEB_SERVICE_KEY: ${{ secrets.AMAP_WEB_SERVICE_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
