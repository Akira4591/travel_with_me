<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Travel With Me</title>

  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/app.css?v=20260510-v10">
</head>

<body>
  <div class="workspace-shell">
    <div class="workspace-tabs" id="workspace-tabs"></div>
    <div class="app-layout">
      <div class="sidebar">
        <div class="header">
          <div class="header-top">
            <div class="title-row">
              <div class="trip-title-display">
                <span id="trip-title-text">五一北京行程</span>
              </div>
            </div>
            <div class="header-actions">
              <button type="button" class="share-trip-btn" id="share-trip-btn">分享长图</button>
            </div>
          </div>
          <p id="trip-subtitle">点击下方行程卡片，右侧地图将自动飞跃至对应地点</p>
        </div>
        <div class="tabs-container" id="tabs-container"></div>
        <div class="itinerary-list" id="itinerary-container"></div>
      </div>

      <div class="map-container">
        <div id="map"></div>
        <div class="status-panel" id="status-panel">正在加载地图...</div>
      </div>
    </div>
  </div>

  <script type="module" src="./js/main.js?v=20260510-v11"></script>
</body>
</html>
