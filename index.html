<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Travel With Me</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/tokens.css?v=20260510-v10" />
    <link rel="stylesheet" href="./css/layout.css?v=20260510-v10" />
    <link rel="stylesheet" href="./css/components.css?v=20260510-v10" />

    <script type="importmap">
      {
        "imports": {
          "three": "/three/build/three.module.js",
          "three/addons/": "/three/examples/jsm/"
        }
      }
    </script>
  </head>

  <body data-mobile-view="list">
    <div class="workspace-shell">
      <div class="workspace-tabs" id="workspace-tabs"></div>
      <div class="mobile-view-switch" role="tablist" aria-label="移动端视图切换">
        <button
          type="button"
          class="mobile-view-btn active"
          data-mobile-view="list"
          aria-selected="true"
        >
          行程
        </button>
        <button type="button" class="mobile-view-btn" data-mobile-view="map" aria-selected="false">
          地图
        </button>
      </div>
      <div class="app-layout">
        <div class="sidebar">
          <div class="header">
            <div class="header-top">
              <div class="title-row">
                <div class="trip-title-display">
                  <span id="trip-title-text">五一北京行程</span>
                </div>
              </div>
              <div class="header-actions">
                <button type="button" class="share-trip-btn" id="share-trip-btn">分享长图</button>
              </div>
            </div>
            <p id="trip-subtitle">点击下方行程卡片，右侧地图将自动飞跃至对应地点</p>
          </div>
          <div class="tabs-container" id="tabs-container"></div>
          <div class="itinerary-list" id="itinerary-container"></div>
        </div>

        <div class="map-container">
          <div id="map"></div>
          <div id="map-3d" hidden></div>
          <button
            type="button"
            class="map-3d-toggle hint"
            id="map-3d-toggle"
            hidden
            aria-label="切换3D视图"
          >
            <span class="map-3d-toggle-dot"></span>
            <span class="map-3d-toggle-label">3D 视图</span>
          </button>
          <div class="status-panel" id="status-panel">正在加载地图...</div>
        </div>
      </div>
    </div>

    <script type="module" src="./js/main.js?v=20260623-gate50-visual-v1"></script>
  </body>
</html>
